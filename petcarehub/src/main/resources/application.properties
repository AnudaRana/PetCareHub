# File: src/main/resources/application.properties

# =============================================
# MySQL DataSource Configuration
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/petcarehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# SQL Initialization
# =============================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/pets

# =============================================
# Server
# =============================================
server.port=8081

# =============================================
# Springdoc OpenAPI / Swagger UI
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# =============================================
# JWT (configure your JWT secret here)
# =============================================
app.jwt.secret=your_jwt_secret_key_here_min_256_bits
app.jwt.expiration=86400000
