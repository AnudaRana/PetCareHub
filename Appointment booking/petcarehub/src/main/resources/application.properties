 # =============================================
# MySQL DataSource Configuration
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/petcarehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# SQL Initialization
# =============================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/pets

# =============================================
# Server
# =============================================
server.port=8083

# =============================================
# Springdoc OpenAPI / Swagger UI
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# =============================================
# JWT
# =============================================
app.jwt.secret=your_jwt_secret_key_here_min_256_bits
app.jwt.expiration=86400000

# =============================================
# Mail Configuration (FIXED)
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=anudaranasinghe2@gmail.com
spring.mail.password=tjhuwgfcsbvqmndm

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeout settings (helps avoid silent failures)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =============================================
# Logging (VERY IMPORTANT FOR DEBUGGING EMAIL)
# =============================================
logging.level.org.springframework.mail=DEBUG
logging.level.org.apache.james.mime4j=ERROR